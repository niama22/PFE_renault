name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Java services (Spring Boot) ──────────────────────────────────────────────
  test-java-services:
    name: Build & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - operateur-service
          - responsable-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        run: |
          cd services/${{ matrix.service }}
          mvn clean verify -B -DskipTests=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  # ── Node.js services (NestJS) ────────────────────────────────────────────────
  build-nodejs-services:
    name: Build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - client-service
          - chauffeur-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: cd services/${{ matrix.service }} && npm ci

      - name: Build
        run: cd services/${{ matrix.service }} && npm run build

  # ── React frontend ───────────────────────────────────────────────────────────
  build-frontend:
    name: Build — frontend-web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Build
        run: cd frontend/web && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/web/dist/
          retention-days: 7

  # ── Docker build verification ────────────────────────────────────────────────
  docker-build-check:
    name: Docker build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test-java-services, build-nodejs-services, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin-service
            context: services/admin-service
          - service: operateur-service
            context: services/operateur-service
          - service: responsable-service
            context: services/responsable-service
          - service: client-service
            context: services/client-service
          - service: chauffeur-service
            context: services/chauffeur-service
          - service: frontend-web
            context: frontend/web
          - service: kong
            context: infrastructure/kong

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: optiflow/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
