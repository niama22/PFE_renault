name: Infrastructure — Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement cible
        required: true
        default: staging
        type: choice
        options: [staging, production]
      action:
        description: Action Terraform
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

  pull_request:
    paths:
      - 'infrastructure/terraform/**'

env:
  TF_DIR: infrastructure/terraform
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }} — ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      # ── Plan (PR + manuel) ──────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ github.event.inputs.environment || 'staging' }}.tfvars" \
            -var="postgres_admin_password=${{ secrets.TF_POSTGRES_PASSWORD }}" \
            -var="keycloak_admin_password=${{ secrets.TF_KEYCLOAK_ADMIN_PASSWORD }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt
        continue-on-error: true

      # Poster le plan en commentaire sur la PR
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(tronqué)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${{ github.event.inputs.environment || 'staging' }}\`\n\`\`\`\n${truncated}\n\`\`\``
            });

      - name: Plan Exit Code
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── Apply (manuel uniquement, action = apply) ───────────────────────────
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var="postgres_admin_password=${{ secrets.TF_POSTGRES_PASSWORD }}" \
            -var="keycloak_admin_password=${{ secrets.TF_KEYCLOAK_ADMIN_PASSWORD }}" \
            -auto-approve \
            tfplan

      # ── Outputs après apply ─────────────────────────────────────────────────
      - name: Show Outputs
        if: github.event.inputs.action == 'apply'
        run: terraform output -no-color

      # ── Destroy (manuel uniquement, action = destroy) ───────────────────────
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -var="postgres_admin_password=${{ secrets.TF_POSTGRES_PASSWORD }}" \
            -var="keycloak_admin_password=${{ secrets.TF_KEYCLOAK_ADMIN_PASSWORD }}" \
            -auto-approve
