_format_version: "3.0"
_transform: true

# ================================================================
# OptiFlow - Kong API Gateway Declarative Configuration
# Mode: DB-less
# JWT validation est gérée par chaque microservice via Keycloak JWKS
# ================================================================

# --- Plugins globaux ---
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:3001"
        - "exp://localhost:19000"
        - "*"
      methods:
        - HEAD
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Auth-Token
        - X-Request-ID
      exposed_headers:
        - X-Auth-Token
        - X-Request-ID
      credentials: true
      max_age: 3600
      preflight_continue: false

  - name: rate-limiting
    config:
      minute: 300
      hour: 10000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

# ================================================================
# Services & Routes
# ================================================================
services:

  # --- Service Client (NestJS) ---
  - name: client-service
    url: http://client-service:3001
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    routes:
      - name: client-api
        paths:
          - /api/v1/clients
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
      - name: client-auth
        paths:
          - /api/v1/auth/client
        strip_path: false
        protocols:
          - http
          - https

  # --- Service Opérateur (Spring Boot) ---
  - name: operateur-service
    url: http://operateur-service:8081
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    routes:
      - name: operateur-api
        paths:
          - /api/v1/operateur
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https
      - name: commandes-api
        paths:
