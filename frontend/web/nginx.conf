server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Lazy DNS resolution so nginx starts even if upstreams aren't up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Keycloak — strips /auth/ prefix
    location /auth/ {
        set $upstream http://keycloak:8180;
        rewrite ^/auth/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to admin-service
    location /api/admin/ {
        set $upstream http://admin-service:8083;
        rewrite ^/api/admin/(.*) /api/v1/admin/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Optimization engine — responsable-service (more specific, takes priority)
    location /api/operateur/optimization/ {
        set $upstream http://responsable-service:8084;
        rewrite ^/api/operateur/optimization/(.*) /api/v1/responsable/optimization/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy to operateur-service
    location /api/operateur/ {
        set $upstream http://operateur-service:8081;
        rewrite ^/api/operateur/(.*) /api/v1/operateur/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy to responsable-service
    location /api/responsable/ {
        set $upstream http://responsable-service:8084;
        rewrite ^/api/responsable/(.*) /api/v1/responsable/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # Proxy to client-service
    location /api/client/ {
        set $upstream http://client-service:3001;
        rewrite ^/api/client/(.*) /api/v1/clients/me/$1 break;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
